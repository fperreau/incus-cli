---
# Inventory pour le lab de test Incus
# Utilise le serveur Incus par défaut via le domaine wsl2 (automata)

all:
  hosts:
    incusos1:
      ansible_host: automata
      ansible_user: perreau
      ansible_connection: ssh
      ansible_private_key_file: ~/.ssh/fperreau
      
  children:
    incus_servers:
      hosts:
        incusos1:
          incus_remote: incusos1
          incus_url: https://10.50.0.100:8443
          
    localhost:
      hosts:
        localhost:
          ansible_connection: local
          
    # Groupe pour le déploiement de The Bastion
    bastion_hosts:
      hosts:
        incusos1:
